<!doctype html>
<html lang="ms-MY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#e11d48">
  <title>Anda di luar talian — The Bukit Besi</title>
  <style>
    :root{color-scheme:light dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#fffaf5;color:#172033}
    main{width:min(100%,520px);padding:clamp(24px,6vw,44px);text-align:center;background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:0 18px 50px rgba(23,32,51,.1)}
    img{width:96px;height:96px;border-radius:22px}h1{font-size:clamp(1.55rem,5vw,2.2rem);line-height:1.15;margin:22px 0 12px}p{line-height:1.65;color:#4b5563}
    button,a{min-height:46px;display:inline-flex;align-items:center;justify-content:center;margin:8px 4px 0;padding:0 18px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
    button{border:0;background:#e11d48;color:#fff}a{color:#172033;border:1px solid #d1d5db;text-decoration:none}
    @media(prefers-color-scheme:dark){body{background:#111827;color:#f9fafb}main{background:#172033;border-color:#374151}p{color:#d1d5db}a{color:#f9fafb;border-color:#4b5563}}
  </style>
</head>
<body>
  <main>
    <img src="https://assets.thebukitbesi.com/pwa/icons/tbb-icon-192.png" width="96" height="96" alt="">
    <h1>Sambungan internet terputus</h1>
    <p>Artikel yang pernah dibuka mungkin masih tersedia. Sambungkan semula internet atau cuba muat semula halaman ini.</p>
    <button type="button" onclick="location.reload()">Cuba semula</button>
    <a href="/">Halaman utama</a>
  </main>
</body>
</html>
